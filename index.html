<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b57d0" />
  <title>AI & 머신러닝 기초 모바일 4지선다</title>
  <meta name="description" content="AI와 머신러닝 기초를 복습하는 모바일 4지선다 125문제 퀴즈" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AI·ML 퀴즈" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #182230;
      --muted: #667085;
      --line: #dce3ef;
      --primary: #0b57d0;
      --primary-soft: #e8f0fe;
      --correct: #137333;
      --correct-soft: #e6f4ea;
      --wrong: #b3261e;
      --wrong-soft: #fce8e6;
      --warn: #8a4b00;
      --shadow: 0 12px 35px rgba(16, 24, 40, .10);
      --radius: 22px;
    }
    [data-theme="dark"] {
      --bg: #0f141c;
      --card: #171e29;
      --text: #f2f5f9;
      --muted: #a7b0bf;
      --line: #2b3544;
      --primary: #8ab4f8;
      --primary-soft: #1d3557;
      --correct: #81c995;
      --correct-soft: #193c27;
      --wrong: #f28b82;
      --wrong-soft: #4a2224;
      --warn: #fdd663;
      --shadow: 0 16px 45px rgba(0, 0, 0, .34);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      line-height: 1.55;
      overscroll-behavior-y: contain;
    }
    button, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .app {
      width: min(760px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom));
    }
    .topbar {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    .title-wrap { min-width: 0; text-align: center; }
    .app-title { margin: 0; font-size: 1.03rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .subtitle { color: var(--muted); font-size: .78rem; }
    .progress-shell {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--line);
      margin-bottom: 12px;
    }
    .progress-bar { height: 100%; width: 0; background: var(--primary); transition: width .25s ease; }
    .quiz-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      touch-action: pan-y;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      animation: fadeIn .18s ease;
    }
    @keyframes fadeIn { from { opacity: .35; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      border-radius: 999px;
      padding: 5px 9px;
      font-size: .76rem;
      font-weight: 750;
      background: var(--primary-soft);
      color: var(--primary);
    }
    .counter { font-size: .82rem; color: var(--muted); white-space: nowrap; }
    .question {
      margin: 4px 0 20px;
      font-size: clamp(1.18rem, 4.8vw, 1.52rem);
      line-height: 1.48;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .options { display: grid; gap: 11px; }
    .option {
      width: 100%;
      display: grid;
      grid-template-columns: 34px 1fr;
      align-items: start;
      gap: 10px;
      text-align: left;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .08s ease;
    }
    .option:active { transform: scale(.992); }
    .option:hover { border-color: var(--primary); }
    .option .num {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--bg);
      font-weight: 850;
      color: var(--muted);
    }
    .option.correct { border-color: var(--correct); background: var(--correct-soft); }
    .option.correct .num { background: var(--correct); color: white; }
    .option.wrong { border-color: var(--wrong); background: var(--wrong-soft); }
    .option.wrong .num { background: var(--wrong); color: white; }
    .option.dim { opacity: .67; }
    .explanation {
      margin-top: 16px;
      border-radius: 16px;
      padding: 14px 15px;
      background: var(--primary-soft);
      border: 1px solid color-mix(in srgb, var(--primary) 35%, transparent);
      display: none;
    }
    .explanation.show { display: block; animation: fadeIn .18s ease; }
    .result-label { font-size: .82rem; font-weight: 850; margin-bottom: 5px; color: var(--primary); }
    .result-label.ok { color: var(--correct); }
    .result-label.no { color: var(--wrong); }
    .swipe-hint { margin-top: auto; padding-top: 18px; text-align: center; font-size: .77rem; color: var(--muted); }
    .bottom-nav {
      position: fixed;
      z-index: 20;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(760px, 100%);
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: 1fr 1.45fr 1fr;
      gap: 9px;
      background: linear-gradient(to top, var(--bg) 78%, transparent);
    }
    .nav-btn {
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--card);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }
    .nav-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    [data-theme="dark"] .nav-btn.primary { color: #07111f; }
    .nav-btn:disabled { opacity: .4; cursor: default; }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(5, 11, 20, .58);
      backdrop-filter: blur(8px);
    }
    .overlay.show { display: grid; }
    .panel {
      width: min(620px, 100%);
      max-height: min(86vh, 820px);
      overflow: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 22px;
    }
    .panel h2 { margin: 0 0 8px; font-size: 1.45rem; }
    .panel p { color: var(--muted); margin: 0 0 18px; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 18px; }
    .stat { background: var(--bg); border-radius: 14px; padding: 12px 8px; text-align: center; }
    .stat strong { display: block; font-size: 1.25rem; }
    .stat span { font-size: .72rem; color: var(--muted); }
    .field { margin: 13px 0; }
    .field label { display: block; font-size: .83rem; font-weight: 800; margin-bottom: 6px; }
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--card);
      color: var(--text);
      padding: 12px;
    }
    .menu-grid { display: grid; gap: 9px; }
    .menu-btn {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--card);
      color: var(--text);
      padding: 13px 14px;
      text-align: left;
      font-weight: 800;
      cursor: pointer;
    }
    .menu-btn strong { display: block; }
    .menu-btn small { color: var(--muted); font-weight: 500; }
    .menu-btn.primary { background: var(--primary); border-color: var(--primary); color: white; }
    [data-theme="dark"] .menu-btn.primary { color: #07111f; }
    .panel-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .category-list { display: grid; gap: 8px; margin-top: 10px; }
    .category-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; border-bottom: 1px solid var(--line); padding: 9px 0; }
    .category-row:last-child { border-bottom: 0; }
    .score-ring {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 12px auto 18px;
      background: conic-gradient(var(--primary) var(--score-angle), var(--line) 0);
      position: relative;
    }
    .score-ring::after { content: ""; position: absolute; inset: 13px; border-radius: 50%; background: var(--card); }
    .score-ring span { z-index: 1; text-align: center; font-weight: 900; font-size: 1.45rem; }
    .score-ring small { display: block; color: var(--muted); font-size: .72rem; }
    .empty { text-align: center; padding: 28px 0; color: var(--muted); }
    .toast {
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: calc(82px + env(safe-area-inset-bottom));
      transform: translate(-50%, 12px);
      opacity: 0;
      pointer-events: none;
      background: #111827;
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: .82rem;
      transition: .2s ease;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 480px) {
      .app { padding-left: 10px; padding-right: 10px; }
      .quiz-card { padding: 17px 15px; min-height: calc(100vh - 155px); border-radius: 19px; }
      .bottom-nav { padding-left: 10px; padding-right: 10px; }
      .nav-btn { font-size: .9rem; }
      .panel { padding: 18px 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="메뉴 열기">☰</button>
      <div class="title-wrap">
        <h1 class="app-title">AI & 머신러닝 기초 4지선다</h1>
        <div class="subtitle" id="modeLabel">모바일 학습 모드</div>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="화면 테마 변경">◐</button>
    </header>

    <div class="progress-shell" aria-label="진행률"><div class="progress-bar" id="progressBar"></div></div>

    <section class="quiz-card" id="quizCard" aria-live="polite">
      <div class="meta-row">
        <div class="chips">
          <span class="chip" id="categoryChip"></span>
          <span class="chip" id="difficultyChip"></span>
        </div>
        <span class="counter" id="counter"></span>
      </div>
      <h2 class="question" id="questionText"></h2>
      <div class="options" id="options"></div>
      <div class="explanation" id="explanation"></div>
      <div class="swipe-hint">← 오른쪽 스와이프: 이전 · 왼쪽 스와이프: 다음 →</div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="문제 이동">
    <button class="nav-btn" id="prevBtn">이전</button>
    <button class="nav-btn primary" id="revealBtn">정답 보기</button>
    <button class="nav-btn" id="nextBtn">다음</button>
  </nav>

  <div class="overlay" id="menuOverlay" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <div class="panel">
      <h2 id="menuTitle">학습 메뉴</h2>
      <p>한 문제씩 풀고, 좌우 스와이프로 이동하세요. 진도와 오답은 이 기기에 저장됩니다.</p>
      <div class="stat-grid">
        <div class="stat"><strong id="totalStat">125</strong><span>전체 문제</span></div>
        <div class="stat"><strong id="solvedStat">0</strong><span>푼 문제</span></div>
        <div class="stat"><strong id="wrongStat">0</strong><span>오답</span></div>
      </div>
      <div class="field">
        <label for="categorySelect">출제 범위</label>
        <select id="categorySelect"></select>
      </div>
      <div class="menu-grid">
        <button class="menu-btn primary" id="continueBtn"><strong>이어서 풀기</strong><small>현재 진도에서 계속</small></button>
        <button class="menu-btn" data-mode="sequence"><strong>선택 범위 순서대로</strong><small>개념 흐름에 맞춰 전체 학습</small></button>
        <button class="menu-btn" data-mode="shuffle"><strong>선택 범위 전체 랜덤</strong><small>문제 순서를 섞어 복습</small></button>
        <button class="menu-btn" data-mode="random20"><strong>랜덤 20문제</strong><small>짧게 한 세트 풀기</small></button>
        <button class="menu-btn" data-mode="wrong"><strong>오답만 다시 풀기</strong><small>틀린 문제 집중 복습</small></button>
        <button class="menu-btn" id="categoryInfoBtn"><strong>범위별 문제 수 보기</strong><small>총 8개 영역</small></button>
        <button class="menu-btn" id="resetBtn"><strong>진도 초기화</strong><small>저장된 답안과 오답 기록 삭제</small></button>
      </div>
      <div class="panel-actions"><button class="nav-btn" id="closeMenuBtn">닫기</button></div>
    </div>
  </div>

  <div class="overlay" id="resultOverlay" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="panel">
      <h2 id="resultTitle">학습 결과</h2>
      <div class="score-ring" id="scoreRing" style="--score-angle:0deg"><span id="scoreText">0%<small>정답률</small></span></div>
      <div class="stat-grid">
        <div class="stat"><strong id="resultCorrect">0</strong><span>정답</span></div>
        <div class="stat"><strong id="resultWrong">0</strong><span>오답</span></div>
        <div class="stat"><strong id="resultSkipped">0</strong><span>미응답</span></div>
      </div>
      <div class="category-list" id="resultCategories"></div>
      <div class="menu-grid" style="margin-top:16px">
        <button class="menu-btn primary" id="reviewWrongBtn"><strong>이번 오답 다시 풀기</strong><small>틀린 문제만 새 세트로 시작</small></button>
        <button class="menu-btn" id="restartBtn"><strong>같은 범위 다시 풀기</strong><small>답안만 초기화</small></button>
        <button class="menu-btn" id="resultMenuBtn"><strong>학습 메뉴로</strong><small>다른 범위 또는 모드 선택</small></button>
      </div>
    </div>
  </div>

  <div class="overlay" id="infoOverlay" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <div class="panel">
      <h2 id="infoTitle">범위별 문제 수</h2>
      <div class="category-list" id="categoryInfo"></div>
      <div class="panel-actions"><button class="nav-btn" id="closeInfoBtn">닫기</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const QUESTIONS = [{"id": 1, "category": "AI · ML · DL", "difficulty": "기본", "question": "AI, 머신러닝(ML), 딥러닝(DL)의 포함 관계로 가장 적절한 것은?", "options": ["ML ⊃ AI ⊃ DL", "AI ⊃ ML ⊃ DL", "AI, ML, DL은 서로 완전히 독립적이다", "DL ⊃ ML ⊃ AI"], "answer": 1, "explanation": "AI가 가장 넓은 개념이고, ML은 AI의 한 접근법이며, DL은 신경망을 사용하는 ML의 한 종류입니다."}, {"id": 2, "category": "AI · ML · DL", "difficulty": "기본", "question": "머신러닝에 대한 설명으로 가장 적절한 것은?", "options": ["정답이 없는 데이터만 다루는 방법이다.", "사람이 모든 규칙을 조건문으로 직접 작성하는 방식만을 뜻한다.", "AI 범주 안에서 데이터로부터 규칙을 학습해 목적을 달성하는 방법론이다.", "신경망을 사용하는 방법만을 뜻한다."], "answer": 2, "explanation": "머신러닝은 사람이 모든 규칙을 직접 코딩하지 않고 데이터에서 패턴과 규칙을 학습하는 AI 접근법입니다."}, {"id": 3, "category": "AI · ML · DL", "difficulty": "기본", "question": "딥러닝에 대한 설명으로 옳은 것은?", "options": ["데이터 없이도 자동으로 규칙을 만든다.", "머신러닝 중 신경망을 사용하는 학습 방법이다.", "반드시 규칙 기반 시스템으로만 구현된다.", "머신러닝과 무관한 별도의 분야이다."], "answer": 1, "explanation": "딥러닝은 머신러닝의 하위 개념이며, 여러 층의 신경망을 활용하는 학습 방법입니다."}, {"id": 4, "category": "AI · ML · DL", "difficulty": "기본", "question": "다음 중 머신러닝을 사용하지 않는 AI의 예로 가장 적절한 것은?", "options": ["사용자 시청 이력으로 학습한 추천 모델", "스팸/정상 메일 데이터로 학습한 분류 모델", "사람이 작성한 규칙과 휴리스틱으로만 동작하는 전문가 시스템", "대량의 이미지로 학습한 분류 모델"], "answer": 2, "explanation": "모든 AI가 머신러닝인 것은 아닙니다. 규칙 기반 시스템이나 휴리스틱 기반 최적화도 AI에 포함될 수 있습니다."}, {"id": 5, "category": "AI · ML · DL", "difficulty": "기본", "question": "다음 설명 중 옳지 않은 것은?", "options": ["모든 AI 시스템은 반드시 머신러닝을 사용해야 한다.", "딥러닝은 머신러닝의 한 종류이다.", "규칙 기반 시스템도 AI에 포함될 수 있다.", "머신러닝은 데이터에서 규칙을 학습할 수 있다."], "answer": 0, "explanation": "AI는 가장 넓은 개념이므로 머신러닝 없이 구현되는 AI도 존재합니다."}, {"id": 6, "category": "AI · ML · DL", "difficulty": "기본", "question": "유튜브 추천과 이메일 스팸 분류의 공통점으로 가장 적절한 것은?", "options": ["항상 같은 입력에 무작위 결과를 낸다.", "정답 데이터가 절대로 필요하지 않다.", "사람이 모든 규칙을 미리 작성하지 않아도 데이터에서 규칙을 학습할 수 있다.", "반드시 동일한 신경망 구조를 사용한다."], "answer": 2, "explanation": "두 사례 모두 데이터로부터 사용자 선호나 스팸 패턴을 학습해 예측 성능을 높일 수 있습니다."}, {"id": 7, "category": "AI · ML · DL", "difficulty": "기본", "question": "머신러닝의 반복적 개선 흐름으로 가장 자연스러운 것은?", "options": ["데이터 → ature: 손실함수 / Label: 학습률", "Feature: 면적·방 수·연식 / Label: 집값", "Feature: 집값 / Label: 면적·방 수", "Feature: 모델 정확도 / Label: 주소"], "answer": 1, "explanation": "집의 특성이 입력이고, 예측하려는 연속값인 집값이 Label입니다."}, {"id": 15, "category": "데이터 · 모델 · 학습", "difficulty": "기본", "question": "유튜브 추천 문제에서 Label로 사용할 수 있는 값은?", "options": ["모델의 파라미터 수", "사용자의 시청 여부나 좋아요 클릭 여부", "영상 파일의 저장 경로만", "학습 서버의 운영체제"], "answer": 1, "explanation": "사용자가 실제로 영상을 시청하거나 클릭했는지 같은 피드백을 정답 신호로 사용할 수 있습니다."}, {"id": 16, "category": "데이터 · 모델 · 학습", "difficulty": "기본", "question": "Y = f*(X) + ε에서 전체 식이 의미하는 것으로 가장 적절한 것은?", "options": ["모든 관측값은 오차 없이 완벽하다.", "Y는 항상 X와 같은 값이다.", "관측값은 입력과 출력의 실제 관계에 오차가 더해져 만들어진다.", "ε는 모델이 선택한 Feature의 개수이다."], "answer": 2, "explanation": "관측 데이터에는 실제 관계 f*(X)뿐 아니라 측정·환경 요인에 따른 오차 ε가 함께 포함될 수 있습니다."}, {"id": 17, "category": "데이터 · 모델 · 학습", "difficulty": "기본", "question": "Y = f*(X) + ε에서 f*가 의미하는 것은?", "options": ["검증 데이터의 평균", "입력과 출력 사이의 실제 참 관계를 나타내는 함수", "학습 데이터의 행 번호", "항상 관측 가능한 예측 오차"], "answer": 1, "explanation": "f*는 실제 세계의 참 관계이지만 일반적으로 직접 관측할 수 없고 데이터를 통해 근사합니다."}, {"id": 18, "category": "데이터 · 모델 · 학습", "difficulty": "기본", "question": "Y = f*(X) + ε에서 ε가 의미하는 것은?", "options": ["측정 기기 한계나 환경 요인 등에 따른 오차", "모델의 이름", "가설공간 전체", "정답 Label 자체"], "answer": 0, "explanation": "ε는 측정오차나 관측되지 않은 환경 요인 등으로 생기는 불확실성을 나타냅니다."}, {"id": 19, "category": "데이터 · 모델 · 학습", "difficulty": "기본", "question": "가설공간(Hypothesis Space)의 정의로 옳은 것은?", "options": ["테스트 데이터의 오답 집합", "최종 선택된 함수 하나", "입력과 출력의 관계를 표현할 수 있는 모든 후보 함수의 집합", "학습 데이터 중 정답만 모은 집합"], "answer": 2, "explanation": "가설공간은 모델이 선택할 수 있는 후보 함수들의 전체 범위입니다."}, {"id": 20, "category": "데이터 · 모델 · 학습", "difficulty": "기본", "question": "모델(Model)의 정의로 가장 적절한 것은?", "options": ["오류를 측정하는 숫자만", "정답이 없는 데이터 전체", "모든 후보 함수의 집합", "가설공간 안에서 선택된 하나의 특정 함수"], "answer": 3, "explanation": "가설공간이 후보 전체라면 모델은 그중 실제로 선택된 하나의 함수입니다."}, {"id": 21, "category": "데이터 · 모델 · 학습", "difficulty": "기본", "question": "머신러닝에서 학습(Learning)을 가장 잘 설명한 것은?", "options": ["모델 평가를 생략하는 과정", "데이터를 모두 삭제하는 과정", "정답을 무작위로 바꾸는 과정", "데이터와 선택 기준을 이용해 적합한 모델을 찾거나 파라미터를 조정하는 과정"], "answer": 3, "explanation": "학습은 손실이 작아지도록 후보 모델을 비교하고 파라미터를 조정하는 과정입니다."}, {"id": 22, "category": "데이터 · 모델 · 학습", "difficulty": "기본", "question": "1D 피처 기반 학습에 대한 설명으로 옳은 것은?", "options": ["Label이 반드시 하나라는 뜻이다.", "입력 Feature가 하나인 가장 단순한 학습 형태이다.", "모델이 항상 분류만 수행한다는 뜻이다.", "데이터가 한 행만 있다는 뜻이다."], "answer": 1, "explanation": "1D는 입력 Feature의 차원이 1이라는 의미입니다."}, {"id": 23, "category": "데이터 · 모델 · 학습", "difficulty": "기본", "question": "p개의 Feature를 가진 한 관측치 x에 대한 설명으로 옳은 것은?", "options": ["x는 Label과 항상 동일하다.", "x는 반드시 하나의 문자여야 한다.", "x는 p차원 벡터로 표현할 수 있다.", "p는 데이터 행의 개수만 뜻한다."], "answer": 2, "explanation": "Feature가 p개라면 한 샘플의 입력은 보통 x ∈ R^p 형태의 벡터로 나타냅니다."}, {"id": 24, "category": "데이터 · 모델 · 학습", "difficulty": "기본", "question": "Feature에 대한 설명으로 옳지 않은 것은?", "options": ["범주형 정보도 Feature가 될 수 있다.", "텍스트와 이미지도 적절한 표현을 거쳐 Feature가 될 수 있다.", "Feature는 반드시 수치형 데이터만 가능하다.", "Feature는 예측 함수의 입력으로 사용된다."], "answer": 2, "explanation": "Feature는 수치뿐 아니라 범주, 텍스트, 이미지, 음성 등 다양한 형태가 가능합니다."}, {"id": 25, "category": "지도학습 · 손실함수", "difficulty": "기본", "question": "지도학습(Supervised Learning)의 정의로 가장 적절한 것은?", "options": ["평가 없이 모델을 고정하는 방법", "정답 Label이 있는 데이터로 입력과 출력의 관계를 학습하는 방법", "데이터 없이 규칙을 생성하는 방법", "정답 없이 데이터 구조만 탐색하는 방법"], "answer": 1, "explanation": "지도학습은 Feature와 Label이 쌍으로 있는 데이터를 사용합니다."}, {"id": 26, "category": "지도학습 · 손실함수", "difficulty": "기본", "question": "지도학습의 궁극적인 목표로 가장 적절한 것은?", "options": ["테스트 데이터를 학습에 반복 사용하기", "모델의 복잡도를 최대화하기", "처음 보는 새로운 입력에서도 정답을 잘 예측하는 것", "훈련 데이터를 무조건 100% 외우는 것"], "answer": 2, "explanation": "지도학습의 핵심은 훈련 데이터 암기가 아니라 새로운 데이터에 대한 일반화입니다."}, {"id": 27, "category": "지도학습 · 손실함수", "difficulty": "기본", "question": "회귀(Regression) 문제의 출력 형태는?", "options": ["항상 참/거짓만", "미리 정해진 범주만", "출력이 존재하지 않음", "연속적인 수치"], "answer": 3, "explanation": "집값, 매출액, 점수, 온도처럼 연속적인 값을 예측하면 회귀입니다."}, {"id": 28, "category": "지도학습 · 손실함수", "difficulty": "기본", "question" culty": "계산", "question": "실제값이 [3, 5], 예측값이 [2, 7]일 때 MSE는?", "options": ["1.5", "2.5", "3", "5"], "answer": 1, "explanation": "오차는 1과 -2이고 제곱은 1과 4입니다. 평균은 (1+4)/2 = 2.5입니다."}, {"id": 45, "category": "회귀 평가 지표", "difficulty": "계산", "question": "MSE가 9라면 RMSE는?", "options": ["3", "9", "4.5", "81"], "answer": 0, "explanation": "RMSE = √9 = 3입니다."}, {"id": 46, "category": "회귀 평가 지표", "difficulty": "기본", "question": "결정계수 R²가 주로 알려주는 것은?", "options": ["평균값만 예측하는 기준 모델 대비 상대적인 설명력", "분류의 오탐 개수", "클러스터 중심점의 좌표", "실제 단위의 평균 오차 크기"], "answer": 0, "explanation": "R²는 평균 예측 대비 모델이 얼마나 더 잘 설명하는지 나타냅니다."}, {"id": 47, "category": "회귀 평가 지표", "difficulty": "기본", "question": "R² = 1의 의미로 가장 적절한 것은?", "options": ["오차가 무한대이다.", "주어진 데이터에서 예측이 실제값을 완벽하게 설명한다.", "항상 언더피팅이다.", "평균 예측보다 나쁘다."], "answer": 1, "explanation": "잔차제곱합이 0이면 R²는 1이 됩니다."}, {"id": 48, "category": "회귀 평가 지표", "difficulty": "기본", "question": "R² = 0의 의미로 가장 적절한 것은?", "options": ["예측이 불가능하다는 뜻만이다.", "항상 데이터가 잘못되었다.", "완벽한 예측이다.", "평균값만 예측하는 모델과 비슷한 수준이다."], "answer": 3, "explanation": "R²가 0이면 기준인 평균 예측보다 개선이 없다는 의미입니다."}, {"id": 49, "category": "회귀 평가 지표", "difficulty": "기본", "question": "R²가 음수가 될 수 있는 경우는?", "options": ["모델이 완벽할 때", "MSE가 정확히 0일 때", "모델이 평균값만 예측하는 것보다도 못할 때", "Feature가 하나일 때"], "answer": 2, "explanation": "잔차제곱합이 전체제곱합보다 크면 R²가 음수가 될 수 있습니다."}, {"id": 50, "category": "회귀 평가 지표", "difficulty": "기본", "question": "R²의 단위에 대한 설명으로 옳은 것은?", "options": ["단위가 없다.", "항상 퍼센트 단위만 가능하다.", "Label 단위와 같다.", "Label 단위의 제곱이다."], "answer": 0, "explanation": "R²는 제곱합의 비율로 계산되므로 단위가 상쇄됩니다."}, {"id": 51, "category": "회귀 평가 지표", "difficulty": "기본", "question": "MSE와 R²를 비교한 설명으로 옳은 것은?", "options": ["둘 다 분류에서만 사용한다.", "둘 다 항상 0과 1 사이이다.", "R²는 실제 단위의 오차를 직접 보여준다.", "MSE는 구체적 오차 크기, R²는 평균 예측 대비 상대 성능을 보여준다."], "answer": 3, "explanation": "두 지표는 서로 다른 관점을 제공하므로 함께 보면 좋습니다."}, {"id": 52, "category": "회귀 평가 지표", "difficulty": "계산", "question": "잔차제곱합(SSE)이 20, 전체제곱합(SST)이 100일 때 R²는?", "options": ["0.5", "0.2", "1.2", "0.8"], "answer": 3, "explanation": "R² = 1 - SSE/SST = 1 - 20/100 = 0.8입니다."}, {"id": 53, "category": "분류 평가 지표", "difficulty": "기본", "question": "정확도(Accuracy)의 계산식으로 옳은 것은?", "options": ["TP / (TP + FP)", "TP / (TP + FN)", "2PR / (P + R)", "(TP + TN) / (TP + TN + FP + FN)"], "answer": 3, "explanation": "정확도는 전체 예측 중 맞힌 비율입니다."}, {"id": 54, "category": "분류 평가 지표", "difficulty": "기본", "question": "양성 1%, 음성 99%인 데이터에서 모두 음성으로 예측했을 때의 문제점은?", "options": ["데이터 불균형은 평가에 아무 영향이 없다.", "정밀도와 재현율이 모두 항상 100%다.", "정확도는 99%지만 양성을 하나도 찾지 못할 수 있다.", "정확도가 반드시 0%가 된다."], "answer": 2, "explanation": "불균형 데이터에서는 다수 클래스를 찍는 것만으로 높은 정확도가 나올 수 있습니다."}, {"id": 55, "category": "분류 평가 지표", "difficulty": "기본", "question": "TP(True Positive)의 의미는?", "options": ["실제 음성을 음성으로 예측한 경우", "실제 음성을 양성으로 예측한 경우", "실제 양성을 음성으로 예측한 경우", "실제 양성을 양성으로 예측한 경우"], "answer": 3, "explanation": "실제와 예측이 모두 Positive이면 TP입니다."}, {"id": 56, "category": "분류 평가 지표", "difficulty": "기본", "question": "TN(True Negative)의 의미는?", "options": ["실제 양성을 음성으로 예측한 경우", "실제 음성을 양성으로 예측한 경우", "실제 양성을 양성으로 예측한 경우", "실제 음성을 음성으로 예측한 경우"], "answer": 3, "explanation": "실제와 예측이 모두 Negative이면 TN입니다."}, {"id": 57, "category": "분류 평가 지표", "difficulty": "기본", "question": "FP(False Positive)의 의미는?", "options": ["실제 양성을 음성으로 잘못 예측한 경우", "실제 양성을 양성으로 예측한 경우", "실제 음성을 양성으로 잘못 예측한 경우", "실제 음성을 음성으로 예측한 경우"], "answer": 2, "explanation": "양성이라고 알렸지만 실제로는 음성인 오탐입니다."}, {"id": 58, "category": "분류 평가 지표", "difficulty": "기본", "question": "FN(False Negative)의 의미는?", "options": ["실제 음성을 음성으로 예측한 경우", "실제 양성을 음성으로 잘못 예측한 경우", "실제 양성을 양성으로 예측한 경우", "실제 음성을 양성으로 잘못 예측한 경우"], "answer": 1, "explanation": "실제 양성을 놓친 누락입니다."}, {"id": 59, "category": "분류 평가 지표", "difficulty": "기본", "question": "통계적 가설검정 관점에서 Type I Error와 대응하는 것은?", "options": ["False Negative(FN)", "True Positive(TP)", "True Negative(TN)", "False Positive(FP)"], "answer": 3, "explanation": "Type I Error는 실제 음성인데 양성으로 판단하는 FP와 대응합니다."}, {"id": 60, "category": "분류 평가 지표", "difficulty": "기본", "question": "통계적 가설검정 관점에서 Type II Error와 대응하는 것은?", "options": ["True Negative(TN)", "False Positive(FP)", "False Negative(FN)", "True Positive(TP)"], "answer": 2, "explanation": "Type II Error는 실제 양성을 놓치는 FN과 대응합니다."}, {"id": 61, "category": "분류 평가 지표", "difficulty": "기본", "question": "정밀도(Precision)의 계산식은?", "options": ["TP / (TP + FP)", "(TP + TN) / 전체", "TN / (TN + FP)", "TP / (TP + FN)"], "answer": 0, "explanation": "정밀도는 양성이라고 예측한 것 중 실제 양성의 비율입니다."}, {"id": 62, "category": "분류 평가 지표", "difficulty": "기본", "question": "재현율(Recall)의 계산식은?", "options": ["TN / (TN + FN)", "TP / (TP + FN)", "TP / (TP + FP)", "FP / (FP + TN)"], "answer": 1, "explanation": "재현율은 실제 양성 중 모델이 찾아낸 비율입니다."}, {"id": 63, "category": "분류 평가 지표", "difficulty": "기본", "question": "F1-score의 정의로 옳은 것은?", "options": ["R²의 제곱근", "TP와 TN의 차이", "정밀도와 재현율의 조화평균", "정확도와 MSE의 산술평균"], "answer": 2, "explanation": "F1 = 2 × Precision × Recall / (Precision + Recall)입니다."}, {"id": 64, "category": "분류 평가 지표", "difficulty": "기본", "question": "False Positive의 비용이 특히 클 때 우선해서 볼 지표는?", "options": ["정밀도(Precision)", "R²", "RMSE", "재현율(Recall)"], "answer": 0, "explanation": "정밀도는 양성 판정의 신뢰도를 보므로 오탐을 줄이는 것이 중요할 때 적합합니다."}, {"id": 65, "category": "분류 평가 지표", "difficulty": "기본", "question": "False Negative의 비용이 특히 클 때 우선해서 볼 지표는?", "options": ["재현율(Recall)", "MSE", "결정계수", "정밀도(Precision)"], "answer": 0, "explanation": "재현율은 실제 양성을 얼마나 놓치지 않고 찾았는지를 봅니다."}, {"id": 66, "category": "분류 평가 지표", "difficulty": "응용", "question": "질병 선별검사에서 환자를 놓치지 않는 것이 가장 중요하다면 우선할 지표는?", "options": ["재현율(Recall)", "RMSE", "R²", "정밀도만"], "answer": 0, "explanation": "환자를 음성으로 놓치는 FN을 줄여야 하므로 재현율이 중요합니다."}, {"id": 67, "category": "분류 평가 지표", "difficulty": "응용", "question": "정상 메일을 스팸으로 보내는 피해가 매우 크다면 우선할 지표는?", "options": ["MSE", "R²", "재현율만", "정밀도(Precision)"], "answer": 3, "explanation": "스팸이라고 예측한 메일이 실제로 스팸인지가 중요하므로 FP를 반영하는 정밀도를 봅니다."}, {"id": 68, "category": "분류 평가 지표", "difficulty": "계산", "question": "TP=30, TN=40, FP=10, FN=20일 때 정확도는?", "options": ["0.75", "0.70", "0.60", "0.50"], "answer": 1, "explanation": "정확도 = (30+40)/(30+40+10+20) = 70/100 = 0.70입니다."}, {"id": 69, "category": "분류 평가 지표", "difficulty": "계산", "question": "TP=30, FP=10일 때 정밀도는?", "options": ["0.70", "0.80", "0.60", "0.75"], "answer": 3, "explanation": "정밀도 = 30/(30+10) = 0.75입니다."}, {"id": 70, "category": "분류 평가 지표", "difficulty": "계산", "question": "TP=30, FN=20일 때 재현율은?", "options": ["0.75", "0.70", "0.50", "0.60"], "answer": 3, "explanation": "재현율 = 30/(30+20) = 0.60입니다."}, {"id": 71, "category": "분류 평가 지표", "difficulty": "계산", "question": "정밀도 0.75, 재현율 0.60일 때 F1-score는 약 얼마인가?", "options": ["0.60", "0.75", "0.45", "0.67"], "answer": 3, "explanation": "F1 = 2×0.75×0.60/(0.75+0.60) ≈ 0.67입니다."}, {"id": 72, "category": "분류 평가 지표", "difficulty": "기본", "question": "교차 엔트로피 손실에 대한 설명으로 옳은 것은?", "options": ["회귀의 R²와 항상 같은 값이다.", "정답 클래스에 준 확률이 높을수록 손실이 작아진다.", "정답 확률이 높을수록 손실이 커진다.", "예측 확률을 전혀 반영하지 않는다."], "answer": 1, "explanation": "정답 확률을 p라 하면 손실은 -log(p)이므로 p가 클수록 작아집니다."}, {"id": 73, "category": "일반화 · 오버피팅", "difficulty": "기본", "question": "일반화(Generalization)의 의미로 가장 적절한 것은?", "options": ["학습에 사용하지 않은 새로운 데이터에서도 좋은 성능을 내는 능력", "Label을 제거하는 것", "훈련 데이터를 그대로 암기하는 능력", "모델의 파라미터를 무조건 늘리는 것"], "answer": 0, "explanation": "머신러닝의 목적은 처음 보는 데이터에서도 잘 예측하는 것입니다."}, {"id": 74, "category": "일반화 · 오버피팅", "difficulty": "기본", "question": "모델 성능을 훈련 데이터만으로 평가하면 안 되는 주된 이유는?", "options": ["테스트 데이터가 모델 파라미터를 직접 학습하기 때문이다.", "훈련 데이터는 항상 정답이 없기 때문이다.", "훈련 데이터에 맞춘 정도만 보여 주며 새로운 데이터 성능을 과대평가할 수 있기 때문이다.", "훈련 데이터에는 Feature가 없기 때문이다."], "answer": 2, "explanation": "훈련오류는 보통 테스트오류보다 낙관적으로 보일 수 있습니다."}, {"id": 75, "category": "일반화 · 오버피팅", "difficulty": "기본", "question": "오버피팅(Overfitting)의 정의로 가장 적절한 것은?", "options": ["훈련과 테스트 분포가 같은 상태", "훈련 데이터의 일반 패턴뿐 아니라 우연한 잡음까지 지나치게 학습한 상태", "모델이 너무 단순해 중요한 패턴을 못 잡은 상태", "정답이 없는 학습 상태"], "answer": 1, "explanation": "오버피팅 모델은 훈련 데이터에는 매우 잘 맞지만 새로운 데이터에서 성능이 떨어집니다."}, {"id": 76, "category":     function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];

      const label = answer.revealed ? "정답 공개" : (answer.correct ? "정답" : "오답");
      const cls = answer.correct ? "ok" : "no";
      els.explanation.innerHTML = `<div class="result-label ${cls}">${label} · 정답 ${q.answer + 1}번</div><div><strong>${escapeHtml(q.options[q.answer])}</strong></div><div style="margin-top:7px">${escapeHtml(q.explanation)}</div>`;
      els.explanation.className = "explanation show";
    }
    function go(delta) {
      const next = state.index + delta;
      if (next < 0) return;
      if (next >= state.order.length) { showResults(); return; }
      state.index = next;
      render();
    }
    function showResults() {
      const rows = state.order.map(id => ({ q: questionById(id), a: state.answers[id] }));
      const answered = rows.filter(r => r.a);
      const correct = answered.filter(r => r.a.correct).length;
      const wrong = answered.filter(r => !r.a.correct).length;
      const skipped = rows.length - answered.length;
      const rate = rows.length ? Math.round((correct / rows.length) * 100) : 0;
      $("#resultCorrect").textContent = correct;
      $("#resultWrong").textContent = wrong;
      $("#resultSkipped").textContent = skipped;
      $("#scoreText").innerHTML = `${rate}%<small>정답률</small>`;
      $("#scoreRing").style.setProperty("--score-angle", `${rate * 3.6}deg`);
      const byCat = {};
      rows.forEach(({q, a}) => {
        byCat[q.category] ||= { total: 0, correct: 0 };
        byCat[q.category].total += 1;
        if (a?.correct) byCat[q.category].correct += 1;
      });
      $("#resultCategories").innerHTML = Object.entries(byCat).map(([k, v]) =>
        `<div class="category-row"><span>${escapeHtml(k)}</span><strong>${v.correct} / ${v.total}</strong></div>`
      ).join("");
      $("#reviewWrongBtn").disabled = state.sessionWrong.length === 0;
      openOverlay(els.resultOverlay);
    }
    function reviewSessionWrong() {
      if (!state.sessionWrong.length) { toast("이번 세트의 오답이 없습니다."); return; }
      state = { order: shuffle([...new Set(state.sessionWrong)]), index: 0, answers: {}, modeName: "이번 오답 복습", category: state.category, updatedAt: Date.now(), sessionWrong: [] };
      saveState(); closeOverlay(els.resultOverlay); render();
    }
    function restartCurrent() {
      state.answers = {}; state.index = 0; state.sessionWrong = [];
      saveState(); closeOverlay(els.resultOverlay); render();
    }
    function openMenu() {
      updateMenuStats();
      openOverlay(els.menuOverlay);
    }
    function updateMenuStats() {
      const answers = Object.values(state.answers || {});
      els.solvedStat.textContent = answers.length;
      els.wrongStat.textContent = wrongBank.size;
      els.continueBtn.style.display = state.order?.length ? "block" : "none";
    }
    function openOverlay(el) { el.classList.add("show"); }
    function closeOverlay(el) { el.classList.remove("show"); }
    function toast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => els.toast.classList.remove("show"), 1600);
    }
    function escapeHtml(str) {
      return String(str).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    }
    function resetAll() {
      if (!confirm("저장된 진도와 오답 기록을 모두 초기화할까요?")) return;
      try { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(WRONG_KEY); } catch {}
      wrongBank = new Set();
      state = baseState();
      saveState();
      toast("진도를 초기화했습니다.");
      closeOverlay(els.menuOverlay);
      render();
    }
    function populateCategories() {
      els.categorySelect.innerHTML = `<option value="전체">전체 125문제</option>` +
        Object.entries(CATEGORY_COUNTS).map(([k,v]) => `<option value="${escapeHtml(k)}">${escapeHtml(k)} · ${v}문제</option>`).join("");
      $("#categoryInfo").innerHTML = Object.entries(CATEGORY_COUNTS).map(([k,v]) =>
        `<div class="category-row"><span>${escapeHtml(k)}</span><strong>${v}문제</strong></div>`
      ).join("") + `<div class="category-row"><span>합계</span><strong>125문제</strong></div>`;
    }
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      const prefs = loadPrefs(); prefs.theme = theme; savePrefs(prefs);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#0f141c" : "#0b57d0");
    }
    function toggleTheme() {
      applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    }

    $("#menuBtn").addEventListener("click", openMenu);
    $("#themeBtn").addEventListener("click", toggleTheme);
    $("#closeMenuBtn").addEventListener("click", () => closeOverlay(els.menuOverlay));
    $("#closeInfoBtn").addEventListener("click", () => closeOverlay(els.infoOverlay));
    $("#categoryInfoBtn").addEventListener("click", () => openOverlay(els.infoOverlay));
    $("#resetBtn").addEventListener("click", resetAll);
    els.continueBtn.addEventListener("click", () => { closeOverlay(els.menuOverlay); render(); });
    document.querySelectorAll("[data-mode]").forEach(btn => btn.addEventListener("click", () => startMode(btn.dataset.mode)));
    els.prevBtn.addEventListener("click", () => go(-1));
    els.nextBtn.addEventListener("click", () => go(1));
    els.revealBtn.addEventListener("click", revealAnswer);
    $("#reviewWrongBtn").addEventListener("click", reviewSessionWrong);
    $("#restartBtn").addEventListener("click", restartCurrent);
    $("#resultMenuBtn").addEventListener("click", () => { closeOverlay(els.resultOverlay); openMenu(); });

    els.quizCard.addEventListener("touchstart", e => {
      const t = e.changedTouches[0]; touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: true });
    els.quizCard.addEventListener("touchend", e => {
      if (!touchStart) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStart.x; const dy = t.clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) > 75 && Math.abs(dx) > Math.abs(dy) * 1.35) {
        if (dx < 0) go(1); else go(-1);
      }
    }, { passive: true });
    document.addEventListener("keydown", e => {
      if (document.querySelector(".overlay.show")) return;
      if (e.key === "ArrowRight") go(1);
      if (e.key === "ArrowLeft") go(-1);
      if (["1","2","3","4"].includes(e.key)) chooseOption(Number(e.key) - 1);
      if (e.key === "Enter") revealAnswer();
    });
    [els.menuOverlay, els.infoOverlay].forEach(overlay => overlay.addEventListener("click", e => {
      if (e.target === overlay) closeOverlay(overlay);
    }));

    populateCategories();
    const prefs = loadPrefs();
    applyTheme(prefs.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    render();
    if (FIRST_VISIT) openMenu();
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
